# Alternative version with explicit filename customization
name: Flutter Multi-Platform Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  apple_android:
    name: Build Android / iOS / macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # ---------- ANDROID ----------
      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Android AAB
        run: flutter build appbundle --release

      # ---------- iOS (Unsigned IPA) ----------
      - name: Build iOS IPA (no signing)
        run: flutter build ipa --release --no-codesign

      # ---------- MACOS ----------
      - name: Build macOS
        run: flutter build macos --release

      # ---------- RENAME AND PREPARE ARTIFACTS ----------
      - name: Rename Android artifacts
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk taskmanager.apk
          cp build/app/outputs/bundle/release/app-release.aab taskmanager.aab

      - name: Rename iOS artifact
        run: |
          for file in build/ios/ipa/*.ipa; do
            cp "$file" taskmanager.ipa
            break
          done

      - name: Rename macOS artifact
        run: |
          for dir in build/macos/Build/Products/Release/*.app; do
            if [ -d "$dir" ]; then
              ditto "$dir" "taskmanager.app"
              break
            fi
          done

      # ---------- UPLOAD ARTIFACTS ----------
      - name: Upload Apple + Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apple-android-builds
          path: |
            taskmanager.apk
            taskmanager.aab
            taskmanager.ipa
            taskmanager.app

  windows_build:
    name: Build Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Rename Windows executable
        run: |
          Copy-Item "build\windows\runner\Release\*.exe" "taskmanager.exe"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: taskmanager.exe

  create_release:
    name: Create Release with Assets
    runs-on: ubuntu-latest
    needs: [apple_android, windows_build]
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            artifacts/apple-android-builds/taskmanager.apk
            artifacts/apple-android-builds/taskmanager.aab
            artifacts/apple-android-builds/taskmanager.ipa
            artifacts/apple-android-builds/taskmanager.app
            artifacts/windows-build/taskmanager.exe
