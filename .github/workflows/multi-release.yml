name: Flutter Multi-Platform Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  apple_android:
    name: Build Android / iOS / macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # ---------- ANDROID ----------
      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Android AAB
        run: flutter build appbundle --release

      # ---------- iOS (Unsigned IPA) ----------
      - name: Build iOS IPA (no signing)
        run: flutter build ipa --release --no-codesign

      # ---------- MACOS ----------
      - name: Build macOS
        run: flutter build macos --release

      # ---------- UPLOAD ARTIFACTS ----------
      - name: Upload Apple + Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apple-android-builds
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            build/ios/ipa/*.ipa
            build/macos/Build/Products/Release/*.app

  windows_build:
    name: Build Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows/runner/Release/*.exe

  create_release:
    name: Create Release with Assets
    runs-on: ubuntu-latest
    needs: [apple_android, windows_build]
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            artifacts/apple-android-builds/app-release.apk
            artifacts/apple-android-builds/app-release.aab
            artifacts/apple-android-builds/*.ipa
            artifacts/apple-android-builds/*.app
            artifacts/windows-build/*.exe
